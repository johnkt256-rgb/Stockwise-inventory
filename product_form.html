{% extends 'base.html' %}{% block title %}{{ 'Edit' if product else 'Add' }} product · StockWise{% endblock %}{% block content %}
<header class="page-head"><div><p class="eyebrow">PRODUCT CATALOGUE</p><h1>{{ 'Edit product' if product else 'Add a product' }}</h1></div><a href="{{ url_for('products') }}">← Back to products</a></header>
<section class="panel form-panel"><form method="post" class="grid-form"><label>Product name<input name="name" value="{{ product['name'] if product else '' }}" required></label><label>Category<input name="category" placeholder="e.g. Medicines" value="{{ product['category'] if product else '' }}" required></label><label>Barcode<input name="barcode" placeholder="Scan or type barcode" value="{{ product['barcode'] if product and product['barcode'] else '' }}"></label><label>Unit<input name="unit" placeholder="e.g. tablets, bottles" value="{{ product['unit'] if product else 'units' }}" required></label><label>Reorder level<input name="reorder_level" type="number" min="0" value="{{ product['reorder_level'] if product else 0 }}" required></label><label>Sale price<input name="sale_price" type="number" min="0" step="0.01" value="{{ product['sale_price'] if product else 0 }}" required></label><div><button>{{ 'Save changes' if product else 'Add product' }}</button></div></form></section>
{% endblock %}
